services:
  - type: web
    name: threadbase-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: threadbase-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false

databases:
  - name: threadbase-db
    databaseName: threadbase
    user: threadbase
    plan: free
